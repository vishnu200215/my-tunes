// depth-of-field from the depth buffer via a second render target
const DOFShader = {
  uniforms: { tDiffuse: { value: null }, tDepth: { value: null }, focus: { value: 0.5 }, range: { value: 0.1 }, maxR: { value: 14 }, res: { value: new THREE.Vector2(W, H) }, near: { value: 1 }, far: { value: 2000 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse, tDepth; uniform float focus, range, maxR, near, far; uniform vec2 res; varying vec2 vUv;
  float lin(float d){ float z = d * 2. - 1.; return 2. * near * far / (far + near - z * (far - near)); }
  void main(){
    float z = lin(texture2D(tDepth, vUv).x);

    vec3 c = texture2D(tDiffuse, vUv).rgb; float wsum = 1.;

      float w = smoothstep(r - 1., r + 1., max(cs, coc * 0.5)) + 0.001;
      c += texture2D(tDiffuse, vUv + o).rgb * w; wsum += w;

    gl_FragColor = vec4(c / wsum, 1.);
  }`
};
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, res: { value: new THREE.Vector2(W, H) }, fade: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time, fade; uniform vec2 res; varying vec2 vUv;
  float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
  void main(){
