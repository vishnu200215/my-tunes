<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Playfair;font-weight:700;src:url(fonts/playfair-display-latin-700-normal.woff2)}
@font-face{font-family:Playfair;font-weight:900;src:url(fonts/playfair-display-latin-900-normal.woff2)}
@font-face{font-family:Plex;font-weight:400;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2)}
@font-face{font-family:Plex;font-weight:600;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2)}

canvas{display:block}

<script src="cues.js"></script>
</head><body>
<canvas id="out"></canvas>
<script>
'use strict';
const P = new URLSearchParams(location.search);
const W = +(P.get("w") || 3840), H = Math.round(W * 1646 / 3840 / 2) * 2;
const PX = W / 3840;              // screen-space unit scale
const C = window.CUES;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const smoother = t => { t = clamp(t); return t * t * t * (t * (t * 6 - 15) + 10); };
const ramp = (t, a, b) => smoother((t - a) / (b - a));
const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);
const easeInQuad = t => clamp(t) * clamp(t);
function track(t, pts) { // [[t,v],...] smooth piecewise
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    const [t0, v0] = pts[i], [t1, v1] = pts[i + 1];
    if (t <= t1) return lerp(v0, v1, smoother((t - t0) / (t1 - t0)));
  }
  return pts[pts.length - 1][1];
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// value noise
const NR = rng(7); const PERM = new Float32Array(512 * 512).map(() => NR());
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const g = (i, j) => PERM[((j & 511) << 9) | (i & 511)];
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(g(xi, yi), g(xi + 1, yi), u), lerp(g(xi, yi + 1), g(xi + 1, yi + 1), u), v);
}
function fbm(x, y, o = 5) { let a = 0, f = 1, s = 0.5, n = 0; for (let i = 0; i < o; i++) { a += s * vnoise(x * f + i * 17.3, y * f - i * 9.1); n += s; f *= 2.03; s *= 0.5; } return a / n; }

// ---------- world layout (world units) ----------
const MAP = { x: 0, y: 0, w: 7600, h: 5200 };
const PIN = { x: 5200, y: 2600 };                 // Abbottabad
const DISCS = { x: 3600, y: 2650 };
const PRINT = { x: 6000, y: 2000, w: 1100, h: 820, rot: 0.05 };
const DOC = { x: 8300, y: 400, w: 2400, h: 6450 };
const ROW0 = 900, ROWH = 165, NROWS = 30;
const rowY = i => ROW0 + i * ROWH;
const NAMED = { 1: ['Cars', 'cars'], 3: ['Chicken Little', 'chicken'], 5: ['BBC Wildlife Documentary', 'bbc'] };
const LAST = { lines: ['Where in the World Is', 'Osama bin Laden?'], y: rowY(NROWS), fs: 140 };
const ROWFS = 130, TEXTX = 340;
const docW = (lx, ly) => ({ x: DOC.x + lx, y: DOC.y + ly });

// ---------- textures ----------
function noiseTex(size, seed, amp, base, fiber) {
  const c = mk(size, size), x = c.getContext('2d'), id = x.createImageData(size, size), r = rng(seed);
  for (let i = 0; i < size * size; i++) {
    const px = i % size, py = (i / size) | 0;
    let v = base + (r() - 0.5) * amp;
    if (fiber) v += (fbm(px / 40, py / 6, 3) - 0.5) * fiber;
    id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = clamp(v, 0, 255); id.data[i * 4 + 3] = 255;
  }
  x.putImageData(id, 0, 0); return c;
}
let paperPat, woodPat, grainTiles = [];
function buildTextures(ctx) {
  // paper: soft mottling (multiply)
  const p = mk(512, 512), px = p.getContext('2d'), id = px.createImageData(512, 512), r = rng(3);
  for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) {
    const n = fbm(x / 64, y / 64, 4), f = fbm(x / 6, y / 90, 2);
    const v = 236 + (n - 0.5) * 34 + (f - 0.5) * 10 + (r() - 0.5) * 10;
    const i = (y * 512 + x) * 4; id.data[i] = v; id.data[i + 1] = v - 3; id.data[i + 2] = v - 9; id.data[i + 3] = 255;
  }
  px.putImageData(id, 0, 0); paperPat = ctx.createPattern(p, 'repeat');
  // wood desk
  const w = mk(1024, 1024), wx = w.getContext("2d"), wd = wx.createImageData(1024, 1024), wr = rng(17);
  for (let y = 0; y < 1024; y++) for (let x = 0; x < 1024; x++) {
    const g = fbm(x / 300, y / 9, 4), ring = Math.sin((g * 18 + x / 140) * 1.0);
    const v = 20 + ring * 4 + (g - 0.5) * 16 + (wr() - 0.5) * 3;
    const i = (y * 1024 + x) * 4; wd.data[i] = v * 1.15; wd.data[i + 1] = v * 0.92; wd.data[i + 2] = v * 0.72; wd.data[i + 3] = 255;
  }
  wx.putImageData(wd, 0, 0); woodPat = ctx.createPattern(w, 'repeat');
  for (let k = 0; k < 6; k++) grainTiles.push(noiseTex(512, 100 + k, 120, 128, 0));
}

// ---------- terrain / map ----------
const GS = 40, GX = Math.ceil(MAP.w / GS) + 1, GY = Math.ceil(MAP.h / GS) + 1;
function height(x, y) {
  const n = fbm(x / 1500, y / 1500, 5), r = 1 - Math.abs(fbm(x / 2600 + 3, y / 2600 - 2, 3) * 2 - 1);
  const north = 1 - y / MAP.h, east = x / MAP.w;
  // a valley bowl around Abbottabad
  const dv = Math.hypot(x - PIN.x, (y - PIN.y) * 1.3) / 1400;
  const bowl = -0.16 * Math.exp(-dv * dv);
  return n * 0.55 + r * 0.25 + north * 0.55 + east * 0.12 - (1 - north) * 0.1 + bowl;
}
let contourPaths = [], hillshade, riverPaths = [], roadPath, gridPath;
function buildMap() {
  const Hh = new Float32Array(GX * GY);
  for (let j = 0; j < GY; j++) for (let i = 0; i < GX; i++) Hh[j * GX + i] = height(i * GS, j * GS);
  const levels = []; for (let L = 0.18; L < 1.3; L += 0.045) levels.push(L);
  levels.forEach((L, li) => {
    const p = new Path2D();
    for (let j = 0; j < GY - 1; j++) for (let i = 0; i < GX - 1; i++) {
      const a = Hh[j * GX + i], b = Hh[j * GX + i + 1], c = Hh[(j + 1) * GX + i + 1], d = Hh[(j + 1) * GX + i];
      const idx = (a > L) | ((b > L) << 1) | ((c > L) << 2) | ((d > L) << 3);
      if (idx === 0 || idx === 15) continue;
      const x0 = i * GS, y0 = j * GS;
      const e = [
        [x0 + GS * (L - a) / (b - a), y0], [x0 + GS, y0 + GS * (L - b) / (c - b)],
        [x0 + GS * (L - d) / (c - d), y0 + GS], [x0, y0 + GS * (L - a) / (d - a)]];
      const segs = { 1: [[3, 0]], 2: [[0, 1]], 3: [[3, 1]], 4: [[1, 2]], 5: [[3, 0], [1, 2]], 6: [[0, 2]], 7: [[3, 2]], 8: [[2, 3]], 9: [[0, 2]], 10: [[0, 1], [2, 3]], 11: [[1, 2]], 12: [[1, 3]], 13: [[0, 1]], 14: [[0, 3]] }[idx];
      for (const [s, t] of segs) { p.moveTo(e[s][0], e[s][1]); p.lineTo(e[t][0], e[t][1]); }
    }
    contourPaths.push({ p, major: li % 4 === 0 });
  });
  // hillshade + tint
  const hw = 760, hh = 520; hillshade = mk(hw, hh);
  const hx = hillshade.getContext('2d'), id = hx.createImageData(hw, hh);
  for (let j = 0; j < hh; j++) for (let i = 0; i < hw; i++) {
    const x = i * 10, y = j * 10, h0 = height(x, y);
    const dx = height(x + 20, y) - height(x - 20, y), dy = height(x, y + 20) - height(x, y - 20);
    const shade = clamp(0.5 + (-dx * 0.7 - dy * 0.7) * 9, 0, 1);
    const k = (id.data.length, (j * hw + i) * 4);
    const base = [214 - h0 * 18, 204 - h0 * 22, 178 - h0 * 30];
    const s = 0.72 + shade * 0.4;
    id.data[k] = base[0] * s; id.data[k + 1] = base[1] * s; id.data[k + 2] = base[2] * s; id.data[k + 3] = 255;
  }
  hx.putImageData(id, 0, 0);
  // rivers
  const wig = (pts, seed, amp) => { // midpoint displacement
    const r = rng(seed); let p = pts;
    for (let it = 0; it < 5; it++) {
      const q = [p[0]];
      for (let i = 0; i < p.length - 1; i++) {
        const [ax, ay] = p[i], [bx, by] = p[i + 1], L = Math.hypot(bx - ax, by - ay);
        const nx = -(by - ay) / L, ny = (bx - ax) / L, d = (r() - 0.5) * L * amp;
        q.push([(ax + bx) / 2 + nx * d, (ay + by) / 2 + ny * d], p[i + 1]);
      }
      p = q; amp *= 0.85;
    }
    return p;
  };
  const toPath = pts => { const p = new Path2D(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); return p; };
  riverPaths = [
    { p: toPath(wig([[2300, -50], [2650, 900], [2200, 1800], [2500, 2600], [1900, 3600], [1450, 5250]], 11, 0.35)), w: 30 },
    { p: toPath(wig([[7650, 2700], [6800, 3250], [6450, 4000], [6950, 5250]], 12, 0.35)), w: 22 },
    { p: toPath(wig([[6050, -50], [6250, 1300], [6650, 2500], [6800, 3250]], 13, 0.3)), w: 12 },
  ];
  roadPath = toPath(wig([[3600, -50], [4300, 1200], [4950, 2050], [PIN.x, PIN.y], [5000, 3500], [4500, 5250]], 21, 0.12));
  gridPath = new Path2D();
  for (let x = 950; x < MAP.w; x += 1300) { gridPath.moveTo(x, 0); gridPath.lineTo(x, MAP.h); }
  for (let y = 650; y < MAP.h; y += 1300) { gridPath.moveTo(0, y); gridPath.lineTo(MAP.w, y); }
}

// ---------- compound aerial print (code-drawn) ----------
let aerial;
function buildAerial() {
  const w = 2048, h = Math.round(2048 * (PRINT.h - 80) / (PRINT.w - 80));
  aerial = mk(w, h); const x = aerial.getContext('2d'), r = rng(42);
  // ground
  const id = x.createImageData(w, h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const n = fbm(i / 260, j / 260, 5), f = fbm(i / 30, j / 30, 2);
    const k = (j * w + i) * 4;
    id.data[k] = 118 + n * 50 + f * 14; id.data[k + 1] = 112 + n * 40 + f * 12; id.data[k + 2] = 84 + n * 26 + f * 8; id.data[k + 3] = 255;
  }
  x.putImageData(id, 0, 0);
  // field patches
  for (let i = 0; i < 26; i++) {
    x.save(); x.translate(r() * w, r() * h); x.rotate(0.35 + (r() - 0.5) * 0.2);
    x.fillStyle = ['rgba(92,108,64,.55)', 'rgba(140,128,86,.45)', 'rgba(70,88,52,.5)', 'rgba(156,142,102,.4)'][i % 4];
    x.fillRect(0, 0, 160 + r() * 380, 100 + r() * 260); x.restore();
  }
  // roads
  x.strokeStyle = 'rgba(196,184,156,.9)'; x.lineCap = 'round';
  x.lineWidth = 34; x.beginPath(); x.moveTo(-50, h * 0.78); x.bezierCurveTo(w * 0.3, h * 0.72, w * 0.6, h * 0.86, w + 50, h * 0.8); x.stroke();
  x.lineWidth = 20; x.beginPath(); x.moveTo(w * 0.18, -40); x.bezierCurveTo(w * 0.22, h * 0.3, w * 0.12, h * 0.55, w * 0.2, h * 0.77); x.stroke();
  // neighbouring houses
  const house = (cx, cy, bw, bh, rot, col) => {
    x.save(); x.translate(cx, cy); x.rotate(rot);
    x.fillStyle = 'rgba(20,18,14,.45)'; x.fillRect(-bw / 2 + 14, -bh / 2 + 18, bw, bh);
    x.fillStyle = col; x.fillRect(-bw / 2, -bh / 2, bw, bh);
    x.fillStyle = 'rgba(255,255,255,.12)'; x.fillRect(-bw / 2, -bh / 2, bw, bh * 0.25); x.restore();
  };
  for (let i = 0; i < 22; i++) {
    const cx = r() * w, cy = r() * h;
    if (Math.hypot(cx - w * 0.55, cy - h * 0.45) < 520) continue;
    house(cx, cy, 70 + r() * 90, 60 + r() * 80, 0.3 + (r() - 0.5) * 0.3, ['#b9ad95', '#a99e88', '#c7bca5'][i % 3]);
  }
  // the compound: irregular walled plot
  x.save(); x.translate(w * 0.55, h * 0.47); x.rotate(0.32);
  const wall = [[-430, -300], [330, -330], [470, 40], [220, 330], [-380, 290]];
  x.beginPath(); wall.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath();
  x.fillStyle = '#9c8f74'; x.fill();
  x.fillStyle = 'rgba(80,70,50,.25)'; x.fill();
  x.lineWidth = 26; x.strokeStyle = 'rgba(25,20,15,.5)'; x.save(); x.translate(10, 14); x.stroke(); x.restore();
  x.strokeStyle = '#ddd3bd'; x.stroke();
  // inner dividing wall
  x.lineWidth = 16; x.beginPath(); x.moveTo(-120, -310); x.lineTo(-60, 300); x.stroke();
  // main building (shadow then roof)
  x.fillStyle = 'rgba(15,12,8,.6)'; x.fillRect(40, -190, 290, 240);
  x.fillStyle = '#d8cfbd'; x.fillRect(0, -230, 290, 240);
  x.fillStyle = 'rgba(0,0,0,.12)'; x.fillRect(0, -230, 290, 18); x.fillRect(140, -230, 10, 240);
  x.fillStyle = 'rgba(15,12,8,.5)'; x.fillRect(-300, 40, 170, 140);
  x.fillStyle = '#cbc1ab'; x.fillRect(-320, 20, 170, 140);
  // trees
  for (let i = 0; i < 9; i++) {
    const tx = -360 + r() * 260, ty = -260 + r() * 520, tr = 26 + r() * 28;
    x.fillStyle = 'rgba(10,10,5,.5)'; x.beginPath(); x.arc(tx + 12, ty + 14, tr, 0, 7); x.fill();
    x.fillStyle = '#4c5a34'; x.beginPath(); x.arc(tx, ty, tr, 0, 7); x.fill();
  }
  x.restore();
  // photographic finish: desaturate-ish warm grade + vignette + grain
  x.globalCompositeOperation = 'color'; x.fillStyle = 'rgba(150,135,105,.35)'; x.fillRect(0, 0, w, h);
  x.globalCompositeOperation = 'source-over';
  const g = x.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, w * 0.7);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.globalAlpha = 0.18; x.globalCompositeOperation = 'overlay'; x.drawImage(noiseTex(512, 77, 200, 128, 0), 0, 0, w, h);
  x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
}

// ---------- camera ----------
const KEYS = () => {
  const lastW = 1222, A = { x: DOC.x + lastW - (lastW - TEXTX + 140) * 0.99, y: DOC.y + LAST.y + 85 };
  const sA = C.l6 + 0.35, sB = C.place - 0.2;
  const tip = u => { const B = PIN, mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy), qx = mx - dy / L * 480, qy = my + dx / L * 480;
    return { x: (1 - u) ** 2 * A.x + 2 * (1 - u) * u * qx + u * u * B.x, y: (1 - u) ** 2 * A.y + 2 * (1 - u) * u * qy + u * u * B.y }; };
  const follow = f => { const tt = lerp(sA, sB, f), u = smoother(f), p = tip(u), c = { x: lerp(A.x, p.x, 0.62), y: lerp(A.y, p.y, 0.62) };
    return { t: tt, x: c.x, y: c.y, vw: Math.min(7600, 3000 + Math.hypot(p.x - A.x, p.y - A.y) * 0.9), k: 1, tl: 42, yw: 0.08 }; };
  const docY = i => DOC.y + rowY(i);
  return [
    { t: 0, x: 4250, y: 2620, vw: 2600, k: 1, tl: 38, yw: -0.04 },
    { t: C.videos, x: 4420, y: 2600, vw: 2700, k: 0.6, tl: 35, yw: -0.02 },
    { t: C.compound + 0.15, x: 5950, y: 2120, vw: 2500, k: 0.75, tl: 30, yw: 0.0 },
    { t: C.abbottabad + 0.3, x: 5900, y: 2300, vw: 3300, k: 0.8, tl: 33, yw: 0.01 },
    { t: C.l1end, x: 5800, y: 2500, vw: 4300, k: 0.7, tl: 40, yw: -0.05 },
    { t: C.l2 + 1.5, x: 9500, y: 1050, vw: 3000, k: 0.35, tl: 27, yw: 0.03 },
    { t: C.l2end - 0.3, x: 9520, y: 1250, vw: 2800, k: 0.45, tl: 18, yw: 0.02 },
    { t: C.cars - 0.3, x: 9560, y: docY(1) + 140, vw: 2150, k: 0.5, tl: 12, yw: 0.0 },
    { t: C.l3end + 0.1, x: 9570, y: docY(5) - 110, vw: 2150, k: 0.4, tl: 12, yw: -0.01 },
    { t: C.scroll - 0.05, x: 9570, y: docY(5) + 40, vw: 2300, k: 0.35, tl: 17, yw: -0.01 },
    { t: C.l4end + 0.15, x: 9520, y: docY(NROWS) + 15, vw: 2650, k: 0.12, tl: 20, yw: 0.02 },
    { t: C.title - 0.1, x: 9520, y: docY(NROWS) + 60, vw: 2600, k: 1, tl: 14, yw: 0.01 },
    { t: C.l6 - 0.1, x: 9500, y: docY(NROWS) + 90, vw: 2500, k: 0.5, tl: 13, yw: 0.0 },
    follow(0.42),
    { t: C.place - 0.3, x: 5750, y: 2650, vw: 3700, k: 0.45, tl: 34, yw: 0.03 },
    { t: C.ended + 0.1, x: 5600, y: 2620, vw: 3250, k: 0.35, tl: 31, yw: 0.02 },
    { t: C.duration - 0.3, x: 6900, y: 4620, vw: 11500, k: 0.5, tl: 46, yw: -0.06 },
    { t: C.duration + 2, x: 7000, y: 4700, vw: 12300, k: 0.5, tl: 48, yw: -0.07 },
  ];
};
let keys;
function camBase(t) {
  const K = keys; t = clamp(t, K[0].t, K[K.length - 1].t);
  let i = 0; while (i < K.length - 2 && t > K[i + 1].t) i++;
  const a = K[i], b = K[i + 1], h = b.t - a.t, u = (t - a.t) / h;
  const tan = (j, f) => {
    const p = K[Math.max(0, j - 1)], n = K[Math.min(K.length - 1, j + 1)];
    return K[j].k * (f(n) - f(p)) / (n.t - p.t);
  };
  const h00 = 2 * u ** 3 - 3 * u ** 2 + 1, h10 = u ** 3 - 2 * u ** 2 + u, h01 = -2 * u ** 3 + 3 * u ** 2, h11 = u ** 3 - u ** 2;
  const f = g => h00 * g(a) + h10 * h * tan(i, g) + h01 * g(b) + h11 * h * tan(i + 1, g);
  return { x: f(k => k.x), y: f(k => k.y), vw: Math.exp(f(k => Math.log(k.vw))), tl: f(k => k.tl), yw: f(k => k.yw) };
}
function impulse(t, t0, amp, f = 38, decay = 11) { const d = t - t0; return d < 0 ? 0 : amp * Math.exp(-d * decay) * Math.sin(d * f); }
function camera(t) {
  const c = camBase(t);
  // handheld
  const hx = 0.0016 * Math.sin(0.83 * t + 1.1) + 0.0009 * Math.sin(2.1 * t + 0.4) + 0.0004 * Math.sin(4.7 * t + 2);
  const hy = 0.0013 * Math.sin(0.71 * t + 2.3) + 0.0008 * Math.sin(1.9 * t + 1.7) + 0.0004 * Math.sin(5.3 * t);
  const shake = impulse(t, C.published, 0.0035) + impulse(t, C.abbottabad, 0.0025) + impulse(t, C.ended, 0.0015, 30, 8);
  return {
    x: c.x + c.vw * hx, y: c.y + c.vw * (hy + shake),
    vw: c.vw * (1 + 0.004 * Math.sin(0.5 * t + 0.3)),
    rot: c.yw + 0.0016 * Math.sin(0.61 * t + 0.5) + 0.0007 * Math.sin(1.7 * t + 1.3) + shake * 0.3,
    tilt: (c.tl + 0.35 * Math.sin(0.47 * t + 0.9)) * Math.PI / 180,
  };
}
// Perspective: a camera pitched by cam.tilt looks at the ground point (cam.x, cam.y).
// The ground width visible across the centre row equals cam.vw.
const ASP = W / H, TANH = Math.tan(11.5 * Math.PI / 180);
function ground(sx, sy, cam) { // sx,sy in [-1,1], sy up. Returns camera-frame ground coords + depth ratio
